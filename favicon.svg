<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="TakeMyLead">
  <!-- The hero's two colours, converted from its oklch tokens:
       #f4430c is --hero-bg, #210200 is --hero-ink. -->
  <rect width="100" height="100" rx="22" fill="#f4430c"/>
  <!-- A heavy lowercase t, matching the wordmark and the hero headline.
       Stem and foot are one stroked path, so the bend stays even; the
       curve leaves the stem vertically, which keeps the join seamless.
       Geometry is identical to the PNG icons. -->
  <g fill="none" stroke="#210200" stroke-width="15" stroke-linecap="butt">
    <path d="M48 16 V64 C48 75 57 77.5 73 77.5"/>
  </g>
  <rect x="24" y="33" width="48" height="14" fill="#210200"/>
</svg>
